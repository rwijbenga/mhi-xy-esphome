esphome:
  name: mhi-xy
  friendly_name: ${devicename}
  min_version: 2024.6.0

esp8266:
  board: d1_mini

substitutions:
  deviceid: "mhi_xy"
  devicename: "MHI XY Interface"

logger:
  level: DEBUG
  baud_rate: 0

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .w-a.nl

web_server:
  port: 80

api:
  reboot_timeout: 0s

external_components:
  - source: github://rwijbenga/mhi-xy-esphome@main
    components: [mhi_xy]
    refresh: 0s

uart:
  id: xy_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 256

# Homebus-to-TTL adapter on D1 Mini RX/TX.
# Listen-only by default. Writing to the XY bus is experimental.
mhi_xy:
  id: mhi_xy_hub
  uart_id: xy_uart
  packet_timeout: 12ms
  allow_control: false

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

climate:
  - platform: mhi_xy
    mhi_xy_id: mhi_xy_hub
    name: "${devicename}"
    visual:
      min_temperature: 16
      max_temperature: 30
      temperature_step: 0.5

binary_sensor:
  - platform: mhi_xy
    mhi_xy_id: mhi_xy_hub
    power:
      name: Power
    swing:
      name: Swing
    checksum_ok:
      name: Checksum OK

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: mhi_xy
    mhi_xy_id: mhi_xy_hub
    setpoint:
      name: Setpoint
    indoor_temperature:
      name: Indoor temperature
    fan_speed:
      name: Fan speed
    vane:
      name: Vane
    packet_count:
      name: Packet count
    checksum_errors:
      name: Checksum errors

text_sensor:
  - platform: version
    name: ESPHome Version
  - platform: wifi_info
    ip_address:
      name: IP
    ssid:
      name: SSID
    bssid:
      name: BSSID
  - platform: mhi_xy
    mhi_xy_id: mhi_xy_hub
    source:
      name: Packet source
    rc_mode:
      name: RC mode
    last_packet:
      name: Last packet
    last_raw:
      name: Last raw
